name: Verificar en Windows, Linux y macOS

# El contenido (≈3 GB de audio) no vive en git: aquí se verifican código,
# pruebas y compilación. Los paquetes con contenido se generan localmente
# (ver docs/building.md).

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            binary: src-tauri/target/release/himnario-adventista.exe
          - name: Linux (Ubuntu 22.04)
            os: ubuntu-22.04
            binary: src-tauri/target/release/himnario-adventista
          - name: macOS (Apple Silicon)
            os: macos-latest
            binary: src-tauri/target/release/himnario-adventista
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libasound2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:rust
      - name: Compilar ejecutable (sin instalador ni contenido)
        run: npm run tauri:build:app

      - uses: actions/upload-artifact@v4
        with:
          name: himnario-${{ runner.os }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
