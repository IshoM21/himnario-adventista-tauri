[package]
name = "himnario-desktop"
version = "1.0.0"
description = "Himnario Adventista Desktop"
authors = ["Himnario Adventista Desktop"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "himnario_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["protocol-asset"] }
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Solo reproducción: MP3 (symphonia-mp3) y AAC/M4A (symphonia-isomp4 + aac).
# Mismo motor validado en sandbox/04-tauri-poc.
rodio = { version = "0.22.2", default-features = false, features = ["playback", "mp3", "mp4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "unwind"
strip = true
